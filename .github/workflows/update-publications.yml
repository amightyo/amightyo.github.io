name: Update ORCID Publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *"

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify ORCID secrets
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: |
          if [ -z "$ORCID_CLIENT_ID" ]; then
            echo "ERROR: ORCID_CLIENT_ID secret is not configured."
            exit 1
          fi

          if [ -z "$ORCID_CLIENT_SECRET" ]; then
            echo "ERROR: ORCID_CLIENT_SECRET secret is not configured."
            exit 1
          fi

          echo "ORCID credentials are configured."

      - name: Update publications from ORCID
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python scripts/update_publications.py

      - name: Check for publication changes
        id: git-check
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publication changes detected."
          fi

      - name: Commit updated publications
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orcid_publications.json generated/orcid-publications.qmd
          git commit -m "Update publications from ORCID"
          git push